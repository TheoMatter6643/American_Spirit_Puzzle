<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Drag the puzzle pieces into the correct spots</h1>
  <div id="status"></div>

  <div id="container">

    <div class="column">
      <h2>Pieces</h2>
      <div class="pieces" id="pieces">

        <!-- ROW 1 -->
        <div class="piece" draggable="true" data-id="r1c1" style="background-image: url('Puzzle/piece_r1_c1.png');"></div>
        <div class="piece" draggable="true" data-id="r1c2" style="background-image: url('Puzzle/piece_r1_c2.png');"></div>
        <div class="piece" draggable="true" data-id="r1c3" style="background-image: url('Puzzle/piece_r1_c3.png');"></div>
        <div class="piece" draggable="true" data-id="r1c4" style="background-image: url('Puzzle/piece_r1_c4.png');"></div>
        <div class="piece" draggable="true" data-id="r1c5" style="background-image: url('Puzzle/piece_r1_c5.png');"></div>
        <div class="piece" draggable="true" data-id="r1c6" style="background-image: url('Puzzle/piece_r1_c6.png');"></div>

        <!-- ROW 2 -->
        <div class="piece" draggable="true" data-id="r2c1" style="background-image: url('Puzzle/piece_r2_c1.png');"></div>
        <div class="piece" draggable="true" data-id="r2c2" style="background-image: url('Puzzle/piece_r2_c2.png');"></div>
        <div class="piece" draggable="true" data-id="r2c3" style="background-image: url('Puzzle/piece_r2_c3.png');"></div>
        <div class="piece" draggable="true" data-id="r2c4" style="background-image: url('Puzzle/piece_r2_c4.png');"></div>
        <div class="piece" draggable="true" data-id="r2c5" style="background-image: url('Puzzle/piece_r2_c5.png');"></div>
        <div class="piece" draggable="true" data-id="r2c6" style="background-image: url('Puzzle/piece_r2_c6.png');"></div>

        <!-- ROW 3 -->
        <div class="piece" draggable="true" data-id="r3c1" style="background-image: url('Puzzle/piece_r3_c1.png');"></div>
        <div class="piece" draggable="true" data-id="r3c2" style="background-image: url('Puzzle/piece_r3_c2.png');"></div>
        <div class="piece" draggable="true" data-id="r3c3" style="background-image: url('Puzzle/piece_r3_c3.png');"></div>
        <div class="piece" draggable="true" data-id="r3c4" style="background-image: url('Puzzle/piece_r3_c4.png');"></div>
        <div class="piece" draggable="true" data-id="r3c5" style="background-image: url('Puzzle/piece_r3_c5.png');"></div>
        <div class="piece" draggable="true" data-id="r3c6" style="background-image: url('Puzzle/piece_r3_c6.png');"></div>

        <!-- ROW 4 -->
        <div class="piece" draggable="true" data-id="r4c1" style="background-image: url('Puzzle/piece_r4_c1.png');"></div>
        <div class="piece" draggable="true" data-id="r4c2" style="background-image: url('Puzzle/piece_r4_c2.png');"></div>
        <div class="piece" draggable="true" data-id="r4c3" style="background-image: url('Puzzle/piece_r4_c3.png');"></div>
        <div class="piece" draggable="true" data-id="r4c4" style="background-image: url('Puzzle/piece_r4_c4.png');"></div>
        <div class="piece" draggable="true" data-id="r4c5" style="background-image: url('Puzzle/piece_r4_c5.png');"></div>
        <div class="piece" draggable="true" data-id="r4c6" style="background-image: url('Puzzle/piece_r4_c6.png');"></div>

      </div>

      <button id="resetBtn">Reset</button>
    </div>

    <div class="column">
      <h2>Board</h2>
      <div class="board" id="board"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
