<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puzzle</title>
  <link rel="icon" href="Puzzle/piece_r1_c1.png">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/American_Spirit_Puzzle/manifest.json">
</head>
<body>

  <h1>Square Puzzle</h1>
  <div id="status"></div>

  <div id="container">

    <div class="column">
      <h2>Board</h2>

      <div class="board-wrapper">
        <div class="row-labels">
          <div>Blue Collar</div>
          <div>White Collar</div>
          <div>Service Sector</div>
          <div>Unemployed</div>
        </div>

        <div id="board" class="board"></div>
      </div>

    </div>

    <!-- RIGHT COLUMN (PIECES) -->
    <div class="column">
      <h2>Pieces</h2>
      <div id="pieces" class="pieces">

        <!-- 24 pieces -->
        <div class="piece" data-id="r1c1" data-group="2" style="background-image: url('Assets/2.png');"></div>
        <div class="piece" data-id="r1c2" data-group="3" style="background-image: url('Assets/3.png');"></div>
        <div class="piece" data-id="r1c3" data-group="3" style="background-image: url('Assets/3.png');"></div>
        <div class="piece" data-id="r1c4" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r1c5" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r1c6" data-group="1" style="background-image: url('Assets/1.png');"></div>

        <div class="piece" data-id="r2c1" data-group="2" style="background-image: url('Assets/2.png');"></div>
        <div class="piece" data-id="r2c2" data-group="3" style="background-image: url('Assets/3.png');"></div>
        <div class="piece" data-id="r2c3" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r2c4" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r2c5" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r2c6" data-group="1" style="background-image: url('Assets/1.png');"></div>

        <div class="piece" data-id="r3c1" data-group="2" style="background-image: url('Assets/2.png');"></div>
        <div class="piece" data-id="r3c2" data-group="3" style="background-image: url('Assets/3.png');"></div>
        <div class="piece" data-id="r3c3" data-group="3" style="background-image: url('Assets/3.png');"></div>
        <div class="piece" data-id="r3c4" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r3c5" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r3c6" data-group="1" style="background-image: url('Assets/1.png');"></div>

        <div class="piece" data-id="r4c1" data-group="2" style="background-image: url('Assets/2.png');"></div>
        <div class="piece" data-id="r4c2" data-group="3" style="background-image: url('Assets/3.png');"></div>
        <div class="piece" data-id="r4c3" data-group="3" style="background-image: url('Assets/3.png');"></div>
        <div class="piece" data-id="r4c4" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r4c5" data-group="6" style="background-image: url('Assets/6.png');"></div>
        <div class="piece" data-id="r4c6" data-group="1" style="background-image: url('Assets/1.png');"></div>

      </div>

      <button id="resetBtn">Reset</button>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
